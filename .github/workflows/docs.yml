name: Docs

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@26
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build docs
        run: pnpm run docs
      - name: Upload PR documentation artifact
        if: github.event_name == 'pull_request'
        id: docs
        uses: actions/upload-artifact@v7
        with:
          name: docs-pr-${{ github.event.pull_request.number }}
          path: ./typedoc-docs
          retention-days: 14
      - name: Add artifact URL to summary
        if: github.event_name == 'pull_request'
        run: |
          echo "## Documentation Preview" >> $GITHUB_STEP_SUMMARY
          echo "[Download documentation (.zip)](${{ steps.docs.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./typedoc-docs

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
